<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008450"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#glBg)"/>
  <!-- Globe outer sphere -->
  <circle cx="50" cy="50" r="32" fill="#065f46" stroke="#ffffff" stroke-width="5.5"/>
  <!-- Longitude ellipse -->
