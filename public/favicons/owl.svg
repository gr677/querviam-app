<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008450"/>
      <stop offset="100%" stop-color="#005a36"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>
  <!-- Left ear tuft -->
  <polygon points="22,32 30,14 44,28" fill="#ffffff"/>
  <!-- Right ear tuft -->
  <polygon points="78,32 70,14 56,28" fill="#ffffff"/>
  <!-- Main white face/head -->
  <circle cx="50" cy="54" r="32" fill="#ffffff"/>
  <!-- Large eyes -->
  <circle cx="37" cy="48" r="14" fill="#008450"/>
  <circle cx="63" cy="48" r="14" fill="#008450"/>
  <!-- Pupils -->
  <circle cx="37" cy="48" r="8" fill="#0f172a"/>
  <circle cx="63" cy="48" r="8" fill="#0f172a"/>
  <!-- Eye highlights -->
  <circle cx="34" cy="45" r="3.2" fill="#ffffff"/>
  <circle cx="60" cy="45" r="3.2" fill="#ffffff"/>
  <!-- Warm orange beak -->
  <polygon points="50,48 43,62 57,62" fill="#f59e0b"/>
  <!-- Breast feather accents -->
  <path d="M42 70 Q50 74 58 70" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M45 76 Q50 79 55 76" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
